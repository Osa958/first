[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tern-lang"
version = "1.0.0"
description = "Tern: a small dynamically-typed language with a bytecode compiler and stack VM"
requires-python = ">=3.10"

[project.scripts]
tern = "tern.__main__:main"

[tool.setuptools]
packages = ["tern"]
